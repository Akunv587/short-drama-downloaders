[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zaizaimao"
version = "0.1.0"
description = "仔仔猫 — 多平台短剧视频下载工具"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "zaizaimao", email = "dev@zaizaimao.local"}
]
keywords = ["video-downloader", "short-drama", "hls", "m3u8", "dramashorts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "httpx>=0.27.0",
    "m3u8>=5.0.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.2.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "nicegui>=3.0.0",
    "h2>=4.0",
    "peewee>=3.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
]

firebase = [
    "firebase-admin>=6.5.0",
]

tiktok = [
    "yt-dlp>=2024.0",
]

[project.scripts]
zaizaimao = "zaizaimao.cli.main:app"

[tool.setuptools.packages.find]
include = ["zaizaimao*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
