<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DramaShorts Downloader-fsk</title>
<style>
  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --card2: #16213e;
    --border: #2a2a4a;
    --text: #e0e0e0;
    --muted: #8888aa;
    --accent: #4ade80;
    --accent2: #38bdf8;
    --danger: #f87171;
    --warning: #fbbf24;
    --radius: 10px;
    --gap: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  header {
    text-align: center;
    padding: 24px 0 16px;
  }
  header h1 { font-size: 1.6rem; color: var(--accent); font-weight: 700; }
  header p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: var(--gap);
  }

  .card-header {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent2);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  textarea {
    width: 100%;
    min-height: 100px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 12px;
    font-size: 0.85rem;
    font-family: "Cascadia Code", "Fira Code", monospace;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--accent2); }

  .btn-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  button, .btn {
    padding: 8px 18px;
    border: none;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .btn-primary { background: var(--accent2); color: #000; }
  .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }

  .btn-accent { background: var(--accent); color: #000; }
  .btn-accent:hover { opacity: 0.85; transform: translateY(-1px); }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-outline:hover { background: var(--card2); }

  .btn-sm { padding: 4px 10px; font-size: 0.78rem; }

  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { opacity: 0.85; }

  .btn:disabled, button:disabled {
    opacity: 0.4; cursor: not-allowed; transform: none;
  }

  input[type="text"], input[type="number"] {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 6px 10px;
    font-size: 0.85rem;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent2); }

  .ep-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
    margin-top: 10px;
  }

  .ep-item {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 0.82rem;
    user-select: none;
  }
  .ep-item:hover { border-color: var(--accent2); }
  .ep-item.selected { border-color: var(--accent); background: #1a3a2e; }

  .ep-item input[type="checkbox"] {
    accent-color: var(--accent);
    width: 15px; height: 15px;
  }

  .range-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .range-row input {
    width: 160px;
  }
  .range-row span { color: var(--muted); font-size: 0.82rem; }

  .settings-row {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 8px;
    font-size: 0.85rem;
  }
  .settings-row label {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    color: var(--muted);
  }
  .settings-row input[type="checkbox"] { accent-color: var(--accent); }
  .settings-row .dir-input { flex: 1; min-width: 180px; }

  /* Progress area */
  .progress-bar-outer {
    height: 8px;
    background: var(--card2);
    border-radius: 4px;
    overflow: hidden;
    margin: 8px 0;
  }
  .progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 4px;
    transition: width 0.3s;
  }

  .task-list { list-style: none; }
  .task-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    font-size: 0.82rem;
    border-bottom: 1px solid var(--border);
  }
  .task-item:last-child { border-bottom: none; }

  .status-icon { font-size: 1rem; width: 20px; text-align: center; flex-shrink: 0; }
  .status-icon.ok { color: var(--accent); }
  .status-icon.fail { color: var(--danger); }
  .status-icon.pending { color: var(--muted); }
  .status-icon.running { color: var(--accent2); }

  .summary {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 0.85rem;
    margin-top: 8px;
    color: var(--muted);
  }
  .summary strong { color: var(--text); }

  .drama-header {
    font-weight: 600;
    color: var(--accent);
    margin: 12px 0 6px;
    font-size: 0.9rem;
  }

  .hidden { display: none !important; }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--card);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.85rem;
    z-index: 1000;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>DramaShorts Downloader-fsk</h1>
    <p>粘贴 dramashorts.io 短剧链接，一键批量下载</p>
  </header>

  <!-- URL Input -->
  <div class="card">
    <div class="card-header">粘贴网址（每行一个）</div>
    <textarea id="urlInput" placeholder="https://dramashorts.io/shorts/abc123?episode=1&#10;https://dramashorts.io/shorts/abc123?episode=2&#10;https://dramashorts.io/shorts/def456"></textarea>
    <div class="btn-row">
      <button class="btn-primary" id="btnExtract" onclick="extractEpisodes()">提取剧集</button>
      <button class="btn-outline" onclick="clearAll()">清空</button>
    </div>
  </div>

  <!-- Episode List (hidden initially) -->
  <div class="card hidden" id="episodeCard">
    <div class="card-header" id="episodeHeader">剧集列表</div>
    <div id="dramaList"></div>
    <div class="range-row">
      <span>快速选择:</span>
      <input type="text" id="rangeInput" placeholder="例: 1-5, 8, 10-15">
      <button class="btn-outline btn-sm" onclick="applyRange()">应用</button>
      <button class="btn-outline btn-sm" onclick="selectAll()">全选</button>
      <button class="btn-outline btn-sm" onclick="invertSelect()">反选</button>
    </div>
    <div class="btn-row">
      <button class="btn-accent" id="btnDownload" onclick="startDownload()">开始下载</button>
      <span style="color:var(--muted);font-size:0.82rem;" id="selectedCount">已选 0 集</span>
    </div>
  </div>

  <!-- Settings -->
  <div class="card">
    <div class="settings-row">
      <label>
        <input type="checkbox" id="chkLoudnorm">
        下载后增强音量 (EBU R128 LoudNorm -11 LUFS + Limiter)
      </label>
      <label style="flex:1;">
        下载目录:
        <input type="text" class="dir-input" id="dirInput" value="./downloads">
      </label>
    </div>
  </div>

  <!-- Progress -->
  <div class="card hidden" id="progressCard">
    <div class="card-header">下载进度</div>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="overallBar" style="width:0%"></div>
    </div>
    <div class="summary">
      <span>总进度: <strong id="overallPct">0%</strong></span>
      <span>完成: <strong id="cntDone" style="color:var(--accent)">0</strong></span>
      <span>失败: <strong id="cntFail" style="color:var(--danger)">0</strong></span>
      <span>剩余: <strong id="cntPending">0</strong></span>
    </div>
    <ul class="task-list" id="taskList"></ul>
    <div class="btn-row hidden" id="retryRow">
      <button class="btn-danger btn-sm" onclick="retryFailed()">重试失败项</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// Global State
// ============================================================
let dramaData = [];       // [{movie_id, title, episodes: [{number, url, cover_url, title}]}]
let taskMap = {};         // task_id -> {ep_num, title, status}
let eventSource = null;

// ============================================================
// URL Parsing
// ============================================================
function getUrls() {
  return document.getElementById('urlInput').value
    .split(/[\n\r]+/)
    .map(s => s.trim())
    .filter(s => s.length > 0 && s.includes('dramashorts.io'));
}

// ============================================================
// Extract Episodes
// ============================================================
async function extractEpisodes() {
  const urls = getUrls();
  if (urls.length === 0) {
    showToast('请至少粘贴一个 dramashorts.io 链接');
    return;
  }

  const btn = document.getElementById('btnExtract');
  btn.disabled = true;
  btn.textContent = '提取中...';

  try {
    const resp = await fetch('/api/extract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ urls }),
    });
    const data = await resp.json();

    if (data.error) {
      showToast('错误: ' + data.error);
      return;
    }

    dramaData = data.dramas || [];
    renderEpisodes();
    document.getElementById('episodeCard').classList.remove('hidden');

    if (data.total_episodes) {
      showToast(`发现 ${data.dramas.length} 部短剧，共 ${data.total_episodes} 集`);
    }
  } catch (e) {
    showToast('请求失败: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '提取剧集';
  }
}

// ============================================================
// Render Episodes
// ============================================================
function renderEpisodes() {
  const container = document.getElementById('dramaList');
  container.innerHTML = '';

  if (dramaData.length === 0) {
    container.innerHTML = '<p style="color:var(--muted)">未找到剧集</p>';
    return;
  }

  dramaData.forEach((drama, di) => {
    const div = document.createElement('div');
    div.innerHTML = `<div class="drama-header">${escHtml(drama.title)} (${drama.episodes.length}集)</div>`;

    const grid = document.createElement('div');
    grid.className = 'ep-grid';

    drama.episodes.forEach(ep => {
      const item = document.createElement('label');
      item.className = 'ep-item';
      const id = `ep_${di}_${ep.number}`;
      item.innerHTML = `<input type="checkbox" id="${id}" data-drama="${di}" data-ep="${ep.number}" onchange="updateCount()"> ${escHtml(ep.title || '第'+ep.number+'集')}`;
      grid.appendChild(item);
    });

    div.appendChild(grid);
    container.appendChild(div);
  });

  updateCount();
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ============================================================
// Selection Helpers
// ============================================================
function getSelectedEpisodes() {
  const result = [];
  const checks = document.querySelectorAll('#dramaList input[type="checkbox"]:checked');
  checks.forEach(cb => {
    const di = parseInt(cb.dataset.drama);
    const epNum = parseInt(cb.dataset.ep);
    const drama = dramaData[di];
    if (drama) {
      const ep = drama.episodes.find(e => e.number === epNum);
      if (ep) {
        result.push({ ...ep, movie_title: drama.title, movie_id: drama.movie_id });
      }
    }
  });
  return result;
}

function getAllEpisodes() {
  const result = [];
  dramaData.forEach(drama => {
    drama.episodes.forEach(ep => {
      result.push({ ...ep, movie_title: drama.title, movie_id: drama.movie_id });
    });
  });
  return result;
}

function updateCount() {
  const sel = getSelectedEpisodes();
  document.getElementById('selectedCount').textContent = `已选 ${sel.length} 集`;
  document.getElementById('btnDownload').disabled = sel.length === 0;
}

function selectAll() {
  document.querySelectorAll('#dramaList input[type="checkbox"]').forEach(cb => { cb.checked = true; });
  updateCount();
}

function invertSelect() {
  document.querySelectorAll('#dramaList input[type="checkbox"]').forEach(cb => { cb.checked = !cb.checked; });
  updateCount();
}

function applyRange() {
  const raw = document.getElementById('rangeInput').value.trim();
  if (!raw) return;

  const allEps = getAllEpisodes();
  const maxNum = allEps.length > 0 ? Math.max(...allEps.map(e => e.number)) : 0;

  // Parse "1-5, 8, 10-15"
  const selected = new Set();
  const parts = raw.split(/[,，\s]+/).filter(Boolean);
  parts.forEach(part => {
    if (part.includes('-')) {
      const [a, b] = part.split('-').map(Number);
      if (!isNaN(a) && !isNaN(b)) {
        for (let i = Math.min(a, b); i <= Math.max(a, b); i++) selected.add(i);
      }
    } else {
      const n = Number(part);
      if (!isNaN(n)) selected.add(n);
    }
  });

  // Check checkboxes
  document.querySelectorAll('#dramaList input[type="checkbox"]').forEach(cb => {
    const epNum = parseInt(cb.dataset.ep);
    cb.checked = selected.has(epNum);
  });
  updateCount();
}

function clearAll() {
  document.getElementById('urlInput').value = '';
  dramaData = [];
  document.getElementById('dramaList').innerHTML = '';
  document.getElementById('episodeCard').classList.add('hidden');
  document.getElementById('progressCard').classList.add('hidden');
  taskMap = {};
}

// ============================================================
// Download
// ============================================================
async function startDownload() {
  const episodes = getSelectedEpisodes();
  if (episodes.length === 0) {
    showToast('请先选择要下载的剧集');
    return;
  }

  const outputDir = document.getElementById('dirInput').value.trim() || './downloads';
  const loudnorm = document.getElementById('chkLoudnorm').checked;
  const movieTitle = episodes[0].movie_title || 'drama';

  const btn = document.getElementById('btnDownload');
  btn.disabled = true;
  btn.textContent = '启动中...';

  // Reset progress
  document.getElementById('progressCard').classList.remove('hidden');
  document.getElementById('overallBar').style.width = '0%';
  document.getElementById('overallPct').textContent = '0%';
  document.getElementById('cntDone').textContent = '0';
  document.getElementById('cntFail').textContent = '0';
  document.getElementById('cntPending').textContent = episodes.length;
  document.getElementById('retryRow').classList.add('hidden');
  document.getElementById('taskList').innerHTML = '';

  taskMap = {};
  episodes.forEach(ep => {
    // Initial placeholder
    ep._dnStatus = 'queued';
  });

  // Render initial task list
  renderTaskList(episodes);

  try {
    const resp = await fetch('/api/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ episodes, output_dir: outputDir, loudnorm, movie_title: movieTitle }),
    });
    const data = await resp.json();

    if (data.error) {
      showToast('错误: ' + data.error);
      return;
    }

    // Map server task_ids to episodes and re-render
    data.task_ids.forEach((tid, i) => {
      if (episodes[i]) episodes[i].task_id = tid;
    });
    renderTaskList(episodes);

    // Connect SSE
    connectSSE();
    showToast(`开始下载 ${data.task_ids.length} 集`);
  } catch (e) {
    showToast('请求失败: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '开始下载';
  }
}

function renderTaskList(episodes) {
  const list = document.getElementById('taskList');
  list.innerHTML = '';

  episodes.forEach(ep => {
    const li = document.createElement('li');
    li.className = 'task-item';
    li.id = 'task_' + (ep.task_id || ep.number);
    li.innerHTML = `
      <span class="status-icon pending">⬜</span>
      <span>${escHtml(ep.title || '第'+ep.number+'集')}</span>
      <span style="margin-left:auto;color:var(--muted);font-size:0.75rem;">等待中</span>
    `;
    list.appendChild(li);
  });
}

// ============================================================
// SSE Connection
// ============================================================
function connectSSE() {
  if (eventSource) eventSource.close();

  eventSource = new EventSource('/api/progress');

  eventSource.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      handleProgress(data);
    } catch (e) {}
  };

  eventSource.onerror = () => {
    // Auto-reconnect is built into EventSource
  };
}

function handleProgress(data) {
  const tid = data.task_id;
  if (!tid) return;

  // Update task state
  if (!taskMap[tid]) {
    taskMap[tid] = { ep_num: data.ep_num, title: data.title, status: 'pending' };
  }

  if (data.type === 'status') {
    taskMap[tid].status = data.status;
    taskMap[tid].error = data.error || '';
    taskMap[tid].file_size = data.file_size || 0;
  } else if (data.type === 'progress') {
    taskMap[tid].percent = data.percent || 0;
    taskMap[tid].phase = data.phase || 'downloading';
  }

  refreshProgressUI();
}

function refreshProgressUI() {
  const allTasks = Object.values(taskMap);
  const total = allTasks.length;
  if (total === 0) return;

  const done = allTasks.filter(t => t.status === 'completed').length;
  const failed = allTasks.filter(t => t.status === 'failed').length;
  const pending = total - done - failed;

  // Overall progress
  let totalPct = 0;
  allTasks.forEach(t => {
    if (t.status === 'completed') totalPct += 100;
    else if (t.status === 'failed') totalPct += 100;
    else totalPct += (t.percent || 0);
  });
  const overallPct = Math.round(totalPct / total);

  document.getElementById('overallBar').style.width = overallPct + '%';
  document.getElementById('overallPct').textContent = overallPct + '%';
  document.getElementById('cntDone').textContent = done;
  document.getElementById('cntFail').textContent = failed;
  document.getElementById('cntPending').textContent = pending;

  if (failed > 0) {
    document.getElementById('retryRow').classList.remove('hidden');
  }

  // Update task list items
  document.querySelectorAll('#taskList .task-item').forEach(li => {
    const tid = li.id.replace('task_', '');
    const t = taskMap[tid];
    if (!t) return;

    const icon = li.querySelector('.status-icon');
    const statusText = li.querySelector('span:last-child');

    switch (t.status) {
      case 'completed':
        if (icon) { icon.className = 'status-icon ok'; icon.textContent = '✅'; }
        if (statusText) {
          const mb = t.file_size ? (t.file_size / 1024 / 1024).toFixed(1) + ' MB' : '';
          statusText.textContent = '完成 ' + mb;
          statusText.style.color = 'var(--accent)';
        }
        break;
      case 'failed':
        if (icon) { icon.className = 'status-icon fail'; icon.textContent = '❌'; }
        if (statusText) {
          statusText.textContent = '失败';
          statusText.style.color = 'var(--danger)';
          statusText.title = t.error || '';
        }
        break;
      case 'downloading':
        if (icon) { icon.className = 'status-icon running'; icon.textContent = '⬇️'; }
        if (statusText) {
          statusText.textContent = (t.percent || 0).toFixed(0) + '%';
          statusText.style.color = 'var(--accent2)';
        }
        break;
      case 'loudnorm':
      case 'loudnorm_analyze':
        if (icon) { icon.className = 'status-icon running'; icon.textContent = '🔊'; }
        if (statusText) {
          statusText.textContent = '增强音量...';
          statusText.style.color = 'var(--warning)';
        }
        break;
      case 'retrying':
        if (icon) { icon.className = 'status-icon running'; icon.textContent = '🔄'; }
        if (statusText) {
          statusText.textContent = '重试中...';
          statusText.style.color = 'var(--warning)';
        }
        break;
      default:
        if (icon) { icon.className = 'status-icon pending'; icon.textContent = '⬜'; }
        if (statusText) {
          statusText.textContent = '等待中';
          statusText.style.color = 'var(--muted)';
        }
    }
  });
}

// ============================================================
// Retry Failed
// ============================================================
async function retryFailed() {
  const failedTasks = Object.entries(taskMap)
    .filter(([_, t]) => t.status === 'failed');

  if (failedTasks.length === 0) {
    showToast('没有失败的下载');
    return;
  }

  // Find original episode data for failed tasks
  const failedEps = [];
  const allEps = getAllEpisodes();
  failedTasks.forEach(([tid, t]) => {
    const ep = allEps.find(e => e.number === t.ep_num);
    if (ep) failedEps.push(ep);
  });

  if (failedEps.length === 0) {
    showToast('无法找到失败的剧集信息');
    return;
  }

  const outputDir = document.getElementById('dirInput').value.trim() || './downloads';
  const loudnorm = document.getElementById('chkLoudnorm').checked;
  const movieTitle = failedEps[0].movie_title || 'drama';

  try {
    const resp = await fetch('/api/retry', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ episodes: failedEps, output_dir: outputDir, loudnorm, movie_title: movieTitle }),
    });
    const data = await resp.json();
    showToast(`重试 ${data.task_ids.length} 集`);
  } catch (e) {
    showToast('请求失败: ' + e.message);
  }
}

// ============================================================
// Toast
// ============================================================
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();

  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ============================================================
// Auto-connect SSE on page load (reconnect after refresh)
// ============================================================
connectSSE();
</script>
</body>
</html>
